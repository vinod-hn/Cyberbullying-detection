name: CI - Preprocessing Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install project in editable mode
      run: |
        pip install -e .

    - name: Validate preprocessing modules
      run: |
        python -c "from text_normalizer import TextNormalizer; print('✅ TextNormalizer import successful')"
        python -c "from code_mix_processor import CodeMixProcessor; print('✅ CodeMixProcessor import successful')"
        python -c "from emoji_handler import EmojiHandler; print('✅ EmojiHandler import successful')"
      working-directory: ./01_preprocessing

    - name: Run preprocessing tests (if available)
      run: |
        if [ -d "01_preprocessing/tests" ]; then
          python -m pytest 01_preprocessing/tests/ -v || echo "⚠️ Some tests failed, but continuing"
        else
          echo "ℹ️ No preprocessing tests found"
        fi

    - name: Validate baseline model imports
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from naive_bayes_classifier import NaiveBayesClassifier; print('✅ NaiveBayesClassifier import successful')" || echo "⚠️ Baseline models not validated"
      working-directory: ./03_models/baseline

    - name: Check for syntax errors
      run: |
        python -m py_compile $(find . -name "*.py" -not -path "*/\.*" -not -path "*/tests/*" | head -20)
