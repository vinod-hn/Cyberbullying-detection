name: CI - Preprocessing Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install project in editable mode
      run: |
        pip install -e .

    - name: Run validation script
      run: |
        python validate_setup.py || echo "⚠️ Some validation checks failed, but continuing"

    - name: Check for syntax errors in Python files
      run: |
        python -m py_compile $(find . -name "*.py" -not -path "*/\.*" -not -path "*/tests/*" | head -20)
