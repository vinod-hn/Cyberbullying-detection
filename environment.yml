name: cyberbullying-detection
channels:
  - pytorch
  - huggingface
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python>=3.9,<3.12

  # Core Data Science
  - numpy>=1.24.0,<2.0.0
  - pandas>=2.0.0,<3.0.0
  - scipy>=1.10.0,<2.0.0

  # Machine Learning
  - scikit-learn>=1.3.0,<2.0.0
  - pytorch>=2.0.0,<3.0.0
  - pytorch-cuda=11.8  # or pytorch-cuda=12.1 for newer CUDA
  
  # Visualization
  - matplotlib>=3.7.0,<4.0.0
  - seaborn>=0.12.0,<1.0.0

  # Utilities
  - tqdm>=4.65.0,<5.0.0

  # Pip-only packages
  - pip
  - pip:
    - transformers>=4.30.0,<5.0.0
    - accelerate>=0.20.0,<1.0.0
    - emoji>=2.0.0,<3.0.0
    - nbstripout>=0.6.0,<1.0.0
